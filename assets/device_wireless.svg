<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2428"/>
      <stop offset="100%" stop-color="#12181a"/>
    </linearGradient>
    <linearGradient id="mouseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3d44"/>
      <stop offset="100%" stop-color="#172024"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="308" height="228" rx="14" fill="url(#cardBg)" stroke="#2e3e44" stroke-width="2"/>

  <!-- Wireless mouse on left -->
  <g transform="translate(88, 122)">
    <path d="M0 -72 C26 -72 42 -54 44 -24 L47 22 C49 56 29 76 0 76 C-29 76 -49 56 -47 22 L-44 -24 C-42 -54 -26 -72 0 -72 Z"
          fill="url(#mouseG)" stroke="#5cd4ef" stroke-width="3"/>
    <line x1="0" y1="-70" x2="0" y2="-16" stroke="#5cd4ef" stroke-width="2"/>
    <path d="M-43 -18 Q0 -6 43 -18" fill="none" stroke="#39525c" stroke-width="2"/>
    <rect x="-6" y="-56" width="12" height="26" rx="6" fill="#0e1416" stroke="#5cd4ef" stroke-width="2"/>
    <path d="M-18 28 L0 16 L18 28" fill="none" stroke="#2fd4c6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 2.4GHz Wireless signal arcs -->
  <path d="M158 102 A24 24 0 0 1 158 138" fill="none" stroke="#5cd4ef" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 90 A40 40 0 0 1 170 150" fill="none" stroke="#2fd4c6" stroke-width="3" stroke-linecap="round"/>
  <path d="M182 78 A56 56 0 0 1 182 162" fill="none" stroke="#0d7c96" stroke-width="3" stroke-linecap="round"/>

  <!-- 8K 2.4G Wireless Receiver Dongle on right -->
  <g transform="translate(238, 120)">
    <!-- USB plug neck -->
    <rect x="-32" y="-12" width="16" height="24" rx="2" fill="#253235" stroke="#5cd4ef" stroke-width="2"/>
    <line x1="-26" y1="-5" x2="-21" y2="-5" stroke="#9cb2ba" stroke-width="2"/>
    <line x1="-26" y1="5" x2="-21" y2="5" stroke="#9cb2ba" stroke-width="2"/>
    <!-- Dongle pyramid / wedge body -->
    <rect x="-16" y="-26" width="54" height="52" rx="10" fill="#1d272b" stroke="#5cd4ef" stroke-width="2.5"/>
    <!-- Status LED -->
    <circle cx="11" cy="-9" r="4" fill="#7ee39d"/>
    <text x="11" y="14" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#5cd4ef">8K</text>
  </g>

  <text x="160" y="216" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="bold" fill="#9cb2ba">WIRED USB-C &amp; 2.4GHz 8K WIRELESS</text>
</svg>

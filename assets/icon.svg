<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b262b"/>
      <stop offset="100%" stop-color="#0f1518"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3c42"/>
      <stop offset="100%" stop-color="#151d20"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cd4ef"/>
      <stop offset="100%" stop-color="#0d7c96"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded badge -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#2e3e44" stroke-width="5"/>
  <!-- Subtle inner cyan ring -->
  <rect x="22" y="22" width="212" height="212" rx="40" fill="none" stroke="#1f3840" stroke-width="2"/>

  <!-- Geometric gaming mouse silhouette -->
  <path d="M128 40 C158 40 176 58 179 92 L183 144 C185 184 162 214 128 214 C94 214 71 184 73 144 L77 92 C80 58 98 40 128 40 Z"
        fill="url(#bodyGrad)" stroke="#5cd4ef" stroke-width="4" stroke-linejoin="round"/>

  <!-- Left / Right button split & palm contour -->
  <line x1="128" y1="42" x2="128" y2="108" stroke="#5cd4ef" stroke-width="3" stroke-linecap="round"/>
  <path d="M77 104 Q128 118 179 104" fill="none" stroke="#39525c" stroke-width="2.5"/>

  <!-- Side buttons cue -->
  <rect x="68" y="114" width="6" height="20" rx="3" fill="#5cd4ef"/>
  <rect x="68" y="140" width="6" height="20" rx="3" fill="#2fd4c6"/>

  <!-- Scroll wheel -->
  <rect x="121" y="58" width="14" height="32" rx="7" fill="#0d1316" stroke="url(#accentGrad)" stroke-width="3"/>
  <line x1="128" y1="65" x2="128" y2="83" stroke="#5cd4ef" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtle LED fin emblem on palm -->
  <path d="M104 148 L128 134 L152 148" fill="none" stroke="#2fd4c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- R6 badge -->
  <rect x="103" y="164" width="50" height="26" rx="8" fill="#0b6980" stroke="#5cd4ef" stroke-width="2"/>
  <text x="128" y="183" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#e6eff2">R6</text>
</svg>
